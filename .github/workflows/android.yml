name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Valida el checksum del gradle-wrapper.jar y cachea dependencias.
      - uses: gradle/actions/setup-gradle@v6

      - name: Lint, tests y build
        run: ./gradlew ktlintCheck lintDebug testDebugUnitTest assembleDebug assembleRelease

      - name: Subir informes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
