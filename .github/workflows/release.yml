name: Release

# Al subir un tag de versión (v1.0.0, v1.1.0…) se compila la APK firmada y se adjunta a una
# Release de GitHub. La clave viene de los secretos del repo y nunca se guarda en él.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Preparar la clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.TOUCHGRASS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto TOUCHGRASS_KEYSTORE_BASE64 del repo (la clave de firma en base64)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Tests y APK firmada
        env:
          TOUCHGRASS_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          TOUCHGRASS_KEYSTORE_PASSWORD: ${{ secrets.TOUCHGRASS_KEYSTORE_PASSWORD }}
          TOUCHGRASS_KEY_ALIAS: ${{ secrets.TOUCHGRASS_KEY_ALIAS }}
          TOUCHGRASS_KEY_PASSWORD: ${{ secrets.TOUCHGRASS_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Comprobar la firma
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Crear la Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          APK="touchgrass-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          gh release create "$TAG" "$APK" "$APK.sha256" --title "TouchGrass $TAG" --generate-notes

      - name: Borrar la clave
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
